name: Blackbook
options:
  bundleIdPrefix: com.marcofabbri
  deploymentTarget:
    iOS: "17.0"
targets:
  Blackbook:
    type: application
    platform: iOS
    sources: Blackbook/Sources
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "2"
    info:
      path: Blackbook/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSContactsUsageDescription: "Blackbook needs access to your contacts to import them and remove them from the system address book upon request."
        NSFaceIDUsageDescription: "Blackbook uses Face ID or Touch ID to secure your private address book."
    entitlements:
      path: Blackbook/Blackbook.entitlements
